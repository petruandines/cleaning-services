name: Portal Worker versioned update (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect first; deploy only after successful inspection
        required: true
        type: choice
        options:
          - inspect
          - deploy
        default: inspect
      confirmation:
        description: For deploy, type UPDATE followed by Worker name and D1 UUID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: portal-worker-versioned-update
  cancel-in-progress: false

jobs:
  worker:
    if: github.repository == 'petruandines/cleaning-services' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the reviewed update at a fixed commit
        uses: actions/checkout@v4
        with:
          ref: eb38249e2fade7a4b89428bd1c967a02dd924abd
          persist-credentials: false
      - name: Read current production routing policy
        uses: actions/checkout@v4
        with:
          ref: main
          path: .production-policy
          persist-credentials: false
      - name: Enforce production Worker routing
        run: node .production-policy/scripts/enforce-portal-worker-production-config.mjs portal-v2-backend/wrangler.jsonc
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal-v2-backend/package-lock.json
      - name: Install locked dependencies without Cloudflare credentials
        run: npm ci --no-audit --no-fund
        working-directory: portal-v2-backend
      - name: Test backend and update guards without Cloudflare credentials
        run: npm test
        working-directory: portal-v2-backend
      - name: Compile Worker without Cloudflare credentials
        run: npx wrangler deploy --dry-run
        working-directory: portal-v2-backend
      - name: Inspect existing Worker and upgraded D1 or deploy reviewed update
        working-directory: portal-v2-backend
        env:
          CI: 'true'
          CLOUDFLARE_ACCOUNT_ID: 47b9f8498a9865c0fbbaca8f0f5cf59d
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_WORKER_UPDATE_TOKEN }}
          PORTAL_WORKER_AUTH_SECRET: ${{ inputs.operation == 'deploy' && secrets.PORTAL_WORKER_AUTH_SECRET || '' }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/update-worker-phone.mjs "$OPERATION" "$CONFIRMATION"
