name: Portal Worker payment locations update (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect first; deploy only after D1 migration 0009
        required: true
        type: choice
        options:
          - inspect
          - deploy
        default: inspect
      confirmation:
        description: For deploy, type UPDATE PORTAL PAYMENT LOCATIONS followed by D1 UUID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: portal-worker-payment-locations-update
  cancel-in-progress: false

jobs:
  worker:
    if: github.repository == 'petruandines/cleaning-services' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read reviewed payment-locations Worker at a fixed commit
        uses: actions/checkout@v4
        with:
          ref: 064bd76ac79bb1e3beae8702795a6c9190829cd3
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal-v2-backend/package-lock.json
      - name: Install locked dependencies without Cloudflare token
        run: npm ci --no-audit --no-fund
        working-directory: portal-v2-backend
      - name: Test backend and deployment guards without Cloudflare token
        run: npm test
        working-directory: portal-v2-backend
      - name: Compile Worker without Cloudflare token
        run: npx wrangler deploy --dry-run
        working-directory: portal-v2-backend
      - name: Inspect or deploy Worker after D1 migration 0009
        working-directory: portal-v2-backend
        env:
          CI: 'true'
          CLOUDFLARE_ACCOUNT_ID: 47b9f8498a9865c0fbbaca8f0f5cf59d
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_WORKER_CONTRACT_TOKEN }}
          PORTAL_WORKER_AUTH_SECRET: ${{ inputs.operation == 'deploy' && secrets.PORTAL_WORKER_AUTH_SECRET || '' }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/deploy-payment-locations-worker-phone.mjs "$OPERATION" "$CONFIRMATION"
