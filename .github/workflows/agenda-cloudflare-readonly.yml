name: Agenda Cloudflare read-only preflight
on:
  push:
    branches: [feat/agenda-safe-frontend-20261020]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'petruandines/cleaning-services'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare identities and bindings without mutations
        env:
          CLOUDFLARE_ACCOUNT_ID: 47b9f8498a9865c0fbbaca8f0f5cf59d
          PORTAL_REPORTS_CF_TOKEN: ${{ secrets.PORTAL_REPORTS_CF_TOKEN }}
          CLOUDFLARE_MIGRATION_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: node scripts/agenda-cloudflare-readonly.mjs
