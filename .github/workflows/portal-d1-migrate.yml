name: Portal D1 initial migrations (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect first; apply only after the inspect run succeeds
        required: true
        type: choice
        options:
          - inspect
          - apply
        default: inspect
      confirmation:
        description: For apply, type APPLY followed by a space and the D1 UUID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: portal-d1-initial-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'petruandines/cleaning-services' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the reviewed backend at a fixed commit
        uses: actions/checkout@v4
        with:
          ref: 3405a131d5a606db90a8eea09d5ada7b09a40134
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal-v2-backend/package-lock.json
      - name: Install locked dependencies without the Cloudflare token
        run: npm ci --no-audit --no-fund
        working-directory: portal-v2-backend
      - name: Test migration guards without the Cloudflare token
        run: node --test test/migrate-phone.test.mjs
        working-directory: portal-v2-backend
      - name: Inspect or apply the initial migrations
        working-directory: portal-v2-backend
        env:
          CI: 'true'
          CLOUDFLARE_ACCOUNT_ID: 47b9f8498a9865c0fbbaca8f0f5cf59d
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_D1_MIGRATE_TOKEN }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/migrate-phone.mjs "$OPERATION" "$CONFIRMATION"
