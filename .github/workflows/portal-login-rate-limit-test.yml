name: Configure portal login rate limit test

on:
  push:
    branches: ["fix/api-login-rate-limit"]

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check scripts/configure-login-rate-limit.mjs
      - name: Configure and verify login rate limit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: node scripts/configure-login-rate-limit.mjs apply
