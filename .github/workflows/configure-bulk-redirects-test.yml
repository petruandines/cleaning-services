name: Configure Cloudflare Bulk Redirects test

on:
  push:
    branches: ["fix/cloudflare-bulk-redirects"]

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check scripts/configure-bulk-redirects.mjs
      - name: Configure and verify Bulk Redirects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: node scripts/configure-bulk-redirects.mjs apply
