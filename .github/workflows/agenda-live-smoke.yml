name: Agenda live read-only smoke
on:
  push:
    branches: [feat/agenda-safe-frontend-20261020]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production public assets and guarded endpoints
        run: node scripts/agenda-live-smoke.mjs
