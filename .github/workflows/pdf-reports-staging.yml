name: PDF reports isolated Cloudflare integration
on:
  push:
    branches: [feat/one-time-pdf-reports]
    paths: [.github/workflows/pdf-reports-staging.yml, scripts/pdf-cloudflare-staging.mjs]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdf-reports-isolated-staging
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 47b9f8498a9865c0fbbaca8f0f5cf59d
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 8e34db0e6b8d2609fc2cf3ef2949794ce7d12e89
          path: .backend-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reviewed backend
        working-directory: .backend-source/portal-v2-backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify backend regression suite
        working-directory: .backend-source/portal-v2-backend
        run: npm test
      - name: Install frontend verification dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify frontend lifecycle
        env:
          ONE_TIME_BACKEND_ROOT: ${{ github.workspace }}/.backend-source/portal-v2-backend
        run: npm run test:portal
      - name: Test isolated Cloudflare D1 and private R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_REPORTS_CF_TOKEN }}
          PDF_BACKEND_ROOT: ${{ github.workspace }}/.backend-source/portal-v2-backend
        run: node scripts/pdf-cloudflare-staging.mjs
