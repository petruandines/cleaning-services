name: Portal isolated one-time projects production deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portal-cascade-deletion-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'petruandines/cleaning-services'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: 47b9f8498a9865c0fbbaca8f0f5cf59d
    steps:
      - name: Select reviewed backend without changing the current production version when D1 activation is pending
        id: module
        env:
          ONE_TIME_D1_TOKEN: ${{ secrets.PORTAL_ONE_TIME_D1_TOKEN }}
        run: |
          if [ -n "$ONE_TIME_D1_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "One-time activation pending: add PORTAL_ONE_TIME_D1_TOKEN. Existing production backend will be preserved."
          fi
      - name: Read verified backend source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.module.outputs.enabled == 'true' && '5e6e1401cf3ef9380d633be5885f28e719a43596' || '2060d84af71fa271c7c69031dfd8b4ced2134e48' }}
          path: .backend-source
          persist-credentials: false
      - name: Read production policy
        uses: actions/checkout@v4
        with:
          ref: main
          path: .production-policy
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .backend-source/portal-v2-backend/package-lock.json
      - name: Install dependencies
        working-directory: .backend-source/portal-v2-backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test reviewed backend
        working-directory: .backend-source/portal-v2-backend
        run: npm test
      - name: Install frontend test dependencies without credentials
        working-directory: .production-policy
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify existing frontend and one-time admin/client lifecycle
        working-directory: .production-policy
        env:
          ONE_TIME_BACKEND_ROOT: ${{ steps.module.outputs.enabled == 'true' && format('{0}/.backend-source/portal-v2-backend', github.workspace) || '' }}
        run: npm run test:portal
      - name: Apply hardened production routing
        run: node .production-policy/scripts/enforce-portal-worker-production-config.mjs .backend-source/portal-v2-backend/wrangler.jsonc
      - name: Compile production Worker
        working-directory: .backend-source/portal-v2-backend
        run: npx wrangler deploy --dry-run
      - name: Apply isolated additive one-time schema
        if: steps.module.outputs.enabled == 'true'
        working-directory: .backend-source/portal-v2-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_ONE_TIME_D1_TOKEN }}
        run: node scripts/one-time-schema.mjs
      - name: Deploy verified Worker code
        working-directory: .backend-source/portal-v2-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
          PORTAL_WORKER_AUTH_SECRET: ${{ secrets.PORTAL_WORKER_AUTH_SECRET }}
        run: node scripts/deploy-cascade-delete-code-only.mjs
      - name: Verify production routing and bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: node .production-policy/scripts/cloudflare-migration.mjs inspect
      - name: Verify live temporary access with isolated disposable fixtures
        if: steps.module.outputs.enabled == 'true'
        working-directory: .backend-source/portal-v2-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_ONE_TIME_D1_TOKEN }}
        run: node scripts/one-time-live-smoke.mjs
