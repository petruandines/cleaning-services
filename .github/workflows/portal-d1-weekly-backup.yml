name: Portal D1 weekly encrypted backup

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-d1-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'petruandines/cleaning-services' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read reviewed backup code at a fixed commit
        uses: actions/checkout@v4
        with:
          ref: 43efc99834bf503a58b12741ce0d60bdd4221ff3
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal-v2-backend/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies without Cloudflare token or backup key
        working-directory: portal-v2-backend
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r scripts/requirements-backup.txt
      - name: Test backend and backup encryption without secrets
        working-directory: portal-v2-backend
        run: |
          npm test
          python -m unittest discover -s test -p backup_test.py
      - name: Export encrypted D1 archive and test recovery locally
        working-directory: portal-v2-backend
        env:
          CI: 'true'
          CLOUDFLARE_ACCOUNT_ID: 47b9f8498a9865c0fbbaca8f0f5cf59d
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_BACKUP_D1_EXPORT_TOKEN }}
          PORTAL_BACKUP_KEY_HEX: ${{ secrets.PORTAL_BACKUP_KEY_HEX }}
          CONFIRMATION: EXPORT PORTAL BACKUP 6816004b-dc95-48c9-be52-9bd4131d157e
        run: node scripts/backup-remote-phone.mjs export "$CONFIRMATION"
      - name: Keep only the verified encrypted archive for 30 days
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: portal-d1-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/portal-d1-backup.pi-d1
          if-no-files-found: error
          retention-days: 30

      - name: Write backup result summary
        if: always()
        env:
          BACKUP_JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('## Weekly encrypted D1 backup\n')
              report.write('Result: ' + os.environ['BACKUP_JOB_STATUS'] + '\n\n')
              report.write('UTC: ' + datetime.now(timezone.utc).isoformat() + '\n\n')
              report.write('A successful run includes encrypted export, authentication, isolated local recovery, row counts and foreign-key checks.\n\n')
              report.write('Download the artifact and keep a private copy outside GitHub/Cloudflare; keep the key separately. Artifacts are retained for 30 days.\n')
          PY
