name: Generate Black Clean Week social preview

on:
  push:
    branches: [main]
    paths:
      - 'black-friday/social-preview.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-social-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image converters
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Rasterize social preview
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import cairosvg
          from PIL import Image
          path = Path('black-friday/social-preview.svg')
          raster = cairosvg.svg2png(url=str(path), output_width=1200, output_height=630)
          im = Image.open(BytesIO(raster)).convert('RGB')

          # Use original, unmodified Petru & Inés logo artwork from the website.
          # The official stacked logo has the symbol above the wordmark;
          # use its genuine symbol and genuine cropped wordmark side by side
          # so the compact Open Graph banner remains legible on mobile.
          original_symbol = Image.open('assets/img/brandmark.png').convert('RGB')
          original_logo = Image.open('assets/img/logo.webp').convert('RGB')
          lw, lh = original_logo.size
          wordmark = original_logo.crop((
              round(lw * 0.035), round(lh * 0.615),
              round(lw * 0.970), round(lh * 0.870)
          ))
          symbol = original_symbol.copy()
          symbol.thumbnail((58, 58), Image.Resampling.LANCZOS)
          im.paste(symbol, (91 + (58 - symbol.width)//2, 18 + (58 - symbol.height)//2))
          wordmark = wordmark.resize((333, 61), Image.Resampling.LANCZOS)
          im.paste(wordmark, (162, 17))

          target = Path('black-friday/social-preview.jpg')
          im.save(target, format='JPEG', quality=87, optimize=True, subsampling=0)
          assert im.size == (1200, 630)
          assert target.stat().st_size < 600_000, 'OG image exceeds recommended size'
          print('Created', target, target.stat().st_size, 'bytes')
          PY
      - name: Commit updated image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add black-friday/social-preview.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Black Clean Week OG preview JPEG'
            git push
          fi
