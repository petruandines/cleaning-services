name: Agenda Cloudflare Pages preview (non-production)
on:
  push:
    branches: [feat/agenda-safe-frontend-20261020]
permissions:
  contents: read
concurrency:
  group: agenda-safe-pages-preview
  cancel-in-progress: true
jobs:
  preview:
    if: github.repository == 'petruandines/cleaning-services'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: 47b9f8498a9865c0fbbaca8f0f5cf59d
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 45df05d8dc714d59f3e18af9fdd768f358756549
          path: .agenda-backend-build
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler
        working-directory: .agenda-backend-build/portal-v2-backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build isolated static files
        run: node scripts/build-cloudflare.mjs
      - name: Deploy only to non-production Pages preview branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: node .agenda-backend-build/portal-v2-backend/node_modules/wrangler/bin/wrangler.js pages deploy dist-cloudflare --project-name petruandines-site --branch agenda-preflight-20261021 --commit-dirty=true
