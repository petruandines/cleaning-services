name: Portal first administrator (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect first; create only after a successful inspect
        required: true
        type: choice
        options:
          - inspect
          - create
        default: inspect
      admin_email:
        description: Lowercase email for the first administrator
        required: true
        type: string
      confirmation:
        description: For create, type CREATE ADMIN followed by UUID and email
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: portal-first-administrator
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'petruandines/cleaning-services' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read reviewed backend at a fixed commit
        uses: actions/checkout@v4
        with:
          ref: 585b36e87cded5e2e10d79c4cdb3df65546f7346
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal-v2-backend/package-lock.json
      - name: Install locked dependencies without credentials
        run: npm ci --no-audit --no-fund
        working-directory: portal-v2-backend
      - name: Test bootstrap and migration guards without credentials
        run: node --test test/admin-phone.test.mjs test/bootstrap.test.mjs test/migrate-phone.test.mjs test/deploy-phone.test.mjs
        working-directory: portal-v2-backend
      - name: Inspect remote D1 without administrator password
        if: inputs.operation == 'inspect'
        working-directory: portal-v2-backend
        env:
          CLOUDFLARE_ACCOUNT_ID: 47b9f8498a9865c0fbbaca8f0f5cf59d
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_D1_ADMIN_TOKEN }}
          OPERATION: ${{ inputs.operation }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/admin-phone.mjs
      - name: Create one administrator after rechecking remote D1
        if: inputs.operation == 'create'
        working-directory: portal-v2-backend
        env:
          CLOUDFLARE_ACCOUNT_ID: 47b9f8498a9865c0fbbaca8f0f5cf59d
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_D1_ADMIN_TOKEN }}
          PORTAL_ADMIN_INITIAL_PASSWORD: ${{ secrets.PORTAL_ADMIN_INITIAL_PASSWORD }}
          OPERATION: ${{ inputs.operation }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/admin-phone.mjs
