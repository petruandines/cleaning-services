name: Portal Worker first deployment (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect first; deploy only after a successful inspect run
        required: true
        type: choice
        options:
          - inspect
          - deploy
        default: inspect
      confirmation:
        description: For deploy, type DEPLOY petru-ines-portal-api
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: portal-worker-first-deployment
  cancel-in-progress: false

jobs:
  worker:
    if: github.repository == 'petruandines/cleaning-services' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the reviewed backend at a fixed commit
        uses: actions/checkout@v4
        with:
          ref: 49dac5015b27414db8e494f2d28c9864238a5a0f
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal-v2-backend/package-lock.json
      - name: Install locked dependencies without Cloudflare credentials
        run: npm ci --no-audit --no-fund
        working-directory: portal-v2-backend
      - name: Test backend and deployment guards without Cloudflare credentials
        run: npm test
        working-directory: portal-v2-backend
      - name: Compile Worker without Cloudflare credentials
        run: npx wrangler deploy --dry-run
        working-directory: portal-v2-backend
      - name: Inspect or deploy the first Worker
        working-directory: portal-v2-backend
        env:
          CI: 'true'
          CLOUDFLARE_ACCOUNT_ID: 47b9f8498a9865c0fbbaca8f0f5cf59d
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_WORKER_DEPLOY_TOKEN }}
          PORTAL_WORKER_AUTH_SECRET: ${{ secrets.PORTAL_WORKER_AUTH_SECRET }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/deploy-phone.mjs "$OPERATION" "$CONFIRMATION"
