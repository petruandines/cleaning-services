name: Test final Bulk Redirect cleanup

on:
  push:
    branches: ["fix/cloudflare-bulk-redirects"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts
        run: |
          node --check scripts/build-cloudflare.mjs
          node --check scripts/cloudflare-migration.mjs
      - name: Build static site
        run: node scripts/build-cloudflare.mjs
      - name: Verify cleanup
        run: |
          test ! -e dist-cloudflare/_worker.js
          test ! -e dist-cloudflare/_routes.json
          test ! -e dist-cloudflare/assets/js/canonical-host.js
          ! grep -R -q '/assets/js/canonical-host.js' dist-cloudflare --include='*.html'
