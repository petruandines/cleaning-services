name: Disable portal workers.dev test

on:
  push:
    branches: ["fix/disable-workers-dev"]

permissions:
  contents: read

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: |
          node --check scripts/disable-portal-workers-dev.mjs
          node --check scripts/enforce-portal-worker-production-config.mjs
          node --check scripts/cloudflare-migration.mjs
      - name: Disable and verify workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: node scripts/disable-portal-workers-dev.mjs
      - name: Verify production guard against every pinned Worker source
        shell: bash
        run: |
          set -euo pipefail
          refs=(
            49dac5015b27414db8e494f2d28c9864238a5a0f
            eb38249e2fade7a4b89428bd1c967a02dd924abd
            c0f3e6bd5d06db6bc5d4f7e45beb7d5adf9e693d
            149526e84c34ceed170393980bc65458043abc0b
            e90b8b5aa3d0960b7d7d6de6c74b3ea2db091849
            780550caeee90788f3076fbb65d58f05080a9ea1
            064bd76ac79bb1e3beae8702795a6c9190829cd3
            97e4aa49168b174800ae5507f3f5e7b28fa0d813
          )
          for ref in "${refs[@]}"; do
            git fetch --depth=1 origin "$ref"
            git show FETCH_HEAD:portal-v2-backend/wrangler.jsonc > /tmp/wrangler.jsonc
            node scripts/enforce-portal-worker-production-config.mjs /tmp/wrangler.jsonc
            node --input-type=module -e "import {readFileSync} from 'node:fs'; const c=JSON.parse(readFileSync('/tmp/wrangler.jsonc','utf8')); if(c.workers_dev!==false||c.preview_urls!==false||c.vars.PUBLIC_API_URL!=='https://api.petruandines.com') process.exit(1)"
            echo "Guard verified for $ref"
          done
      - name: Verify current live Cloudflare state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: node scripts/cloudflare-migration.mjs inspect
