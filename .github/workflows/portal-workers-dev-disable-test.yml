name: Disable portal workers.dev test

on:
  push:
    branches: ["fix/disable-workers-dev"]

permissions:
  contents: read

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check scripts/disable-portal-workers-dev.mjs
      - name: Disable and verify workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: node scripts/disable-portal-workers-dev.mjs
