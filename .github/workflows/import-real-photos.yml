name: Temporary real-photo import
on:
  push:
    paths:
      - '.github/workflows/import-real-photos.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Transfer original images securely and validate resolution
        run: |
          python - <<'PY'
            import io, os, urllib.request
            from PIL import Image
            photos = [{"name":"ines-curatare-dulap-abur","thumb":"https://media.canva.com/v2/image-resize/format:JPG/height:150/quality:75/uri:ifs%3A%2F%2FM%2Fbb8629ce-f4fc-4324-86fd-f4ded3711174/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAABTONGRCWGvcRAQPuDcREDUJwHeaAltXxBmwoTg9vZOG&exp=1793721010&osig=AAAAAAAAAAAAAAAAAAAAAMwn-7QmMpTQvSZrabteLdongfMLSQ9I7RTas6jPghEc&signer=media-rpc&token=AAIAAU0AJGJiODYyOWNlLWY0ZmMtNDMyNC04NmZkLWY0ZGVkMzcxMTE3NAAAAAABoaIah1D6B26C4rxZe4iPBYLXcJIHMgjxZnaKmdmhuF7aUwZnGg&x-canva-quality=thumbnail","width":1536,"height":1157},{"name":"ines-curatare-abur","thumb":"https://media.canva.com/v2/image-resize/format:JPG/height:150/quality:75/uri:ifs%3A%2F%2FM%2Fd84bb6a0-5c6a-4250-848e-413d2d5e7b9c/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAACG8n7jz4-Hd2GE0BLevg_Drv4sXLbzP2IoQMLi00XCZ&exp=1793719759&osig=AAAAAAAAAAAAAAAAAAAAALal7j9NnLicHY7LsvQhgfyIM-vxxVQUpRxaxEzawDtA&signer=media-rpc&token=AAIAAU0AJGQ4NGJiNmEwLTVjNmEtNDI1MC04NDhlLTQxM2QyZDVlN2I5YwAAAAABoaIHcJid3PnbAcaoxUZ2iQPNf1oV3qooNYgSjdoSvkWEfkW8hw&x-canva-quality=thumbnail","width":1536,"height":1157},{"name":"filtru-hota-abur-inainte-dupa","thumb":"https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F46735620-8dbf-4ecf-be17-0a10b8410974/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAALkzDK9fDgV4KRcfgZiiF3yDZOD_NqK9BOQ5aLnJ9ris&exp=1793721072&osig=AAAAAAAAAAAAAAAAAAAAACtRJReebRPbKrxFYlMEkARRdymsH9lF1L7yQvZxGxXf&signer=media-rpc&token=AAIAAU0AJDQ2NzM1NjIwLThkYmYtNGVjZi1iZTE3LTBhMTBiODQxMDk3NAAAAAABoaIbeYA8PDbg7A3hto0wGtlANDdsz1m1IlPorbA4OZaguv79cg&x-canva-quality=thumbnail","width":1536,"height":1536},{"name":"saltea-protectie-solara-inainte-dupa","thumb":"https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2Fab526484-a768-45b9-bb8d-6c95f3ef69e6/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAFnZcumU5U71BBQNgl9j8eGBgz3TqtS3Z494vmLOKnzc&exp=1793720618&osig=AAAAAAAAAAAAAAAAAAAAAK3DqNMo2RaU1JlDHeTw1NaH2tVSOSs1FE9hrxLv0-Wa&signer=media-rpc&token=AAIAAU0AJGFiNTI2NDg0LWE3NjgtNDViOS1iYjhkLTZjOTVmM2VmNjllNgAAAAABoaIUjBCDsqVF2Dqyiwq7P4EVz_POKMIFzRb7ImbfsE_20UvTOA&x-canva-quality=thumbnail","width":864,"height":1536}]
            for photo in photos:
                thumb = photo["thumb"]
                w = photo["width"]; h = photo["height"]
                for target_width in (w, min(1200,w),800):
                    hh = round(h*target_width/w)
                    import re
                    url = re.sub(r"(?<=/width:)\d+",str(target_width),re.sub(r"(?<=/height:)\d+",str(hh),thumb))
                    try:
                        req = urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                        with urllib.request.urlopen(req,timeout=25) as f:
                            b = f.read()
                        im = Image.open(io.BytesIO(b))
                        print(photo["name"],"candidate",target_width,"=>", im.size,flush=True)
                        if im.width >= 600:
                            os.makedirs("assets/img/real",exist_ok=True)
                            out="assets/img/real/"+photo["name"]+".webp"
                            im.convert("RGB").save(out,"WEBP",quality=84,method=6)
                            break
                    except Exception as ex:
                        print("Candidate failed:",str(ex)[:200],flush=True)
                else:
                    raise RuntimeError("Nu există o variantă la rezoluție suficientă pentru "+photo["name"])
            
          PY
      - name: Commit verified image files and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-real-photos.yml
          git add assets/img/real/
          git commit -m 'Add four real cleaning photographs, preserving existing imagery'
          git push
