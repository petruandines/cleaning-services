name: Cloudflare domain migration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cloudflare-migration.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-domain-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'petruandines/cleaning-services' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: 47b9f8498a9865c0fbbaca8f0f5cf59d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c3c674c13060b1c0a5e34a9e41fdf31615d92f98
          path: .migration/backend-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned deployment dependencies without credentials
        working-directory: .migration/backend-source/portal-v2-backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test portal and compile without credentials
        working-directory: .migration/backend-source/portal-v2-backend
        run: |
          npm test
          npx wrangler deploy --dry-run
      - name: Build public site and verify local links
        run: node scripts/build-cloudflare.mjs
      - name: Verify existing resources and prepare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: node scripts/cloudflare-migration.mjs prepare
      - name: Publish site and portal frontend to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: node .migration/backend-source/portal-v2-backend/node_modules/wrangler/bin/wrangler.js pages deploy dist-cloudflare --project-name petruandines-site --branch main --commit-dirty=true
      - name: Update portal origins and popup destinations, preserving secrets and database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        working-directory: .migration/backend-source/portal-v2-backend
        run: npx wrangler deploy --keep-vars
      - name: Verify deployed preview and protected portal API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: node scripts/cloudflare-migration.mjs verify-preview
      - name: Connect petruandines.com and www DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: node scripts/cloudflare-migration.mjs connect
      - name: Verify HTTPS on custom domains
        run: node scripts/cloudflare-migration.mjs verify-domain
