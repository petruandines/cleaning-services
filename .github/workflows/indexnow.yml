name: IndexNow - public page updates
on:
  workflow_run:
    workflows: ["Cloudflare site publication and verification"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: 'URLs to notify'
        type: choice
        options: [offers, all]
        default: offers
permissions:
  contents: read
  actions: read
concurrency:
  group: indexnow-public
  cancel-in-progress: false
jobs:
  notify:
    if: github.repository == 'petruandines/cleaning-services' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Notify IndexNow after verified Cloudflare publication
        env:
          AFTER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          SUBMIT_SCOPE: ${{ inputs.scope || '' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -u scripts/indexnow.py
