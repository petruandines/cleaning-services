name: Portal D1 payment locations (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect first; apply only after checking backup and recovery bookmark
        required: true
        type: choice
        options:
          - inspect
          - apply
        default: inspect
      confirmation:
        description: For apply, type APPLY PORTAL PAYMENT LOCATIONS followed by D1 UUID
        required: false
        type: string
      backup_confirmation:
        description: For apply, type TIME TRAVEL VERIFIED followed by D1 UUID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: portal-d1-payment-locations-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.repository == 'petruandines/cleaning-services' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read reviewed payment-locations upgrade at a fixed commit
        uses: actions/checkout@v4
        with:
          ref: 064bd76ac79bb1e3beae8702795a6c9190829cd3
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal-v2-backend/package-lock.json
      - name: Install locked dependencies without Cloudflare token
        run: npm ci --no-audit --no-fund
        working-directory: portal-v2-backend
      - name: Test payment-locations migration and backend without Cloudflare token
        run: npm test
        working-directory: portal-v2-backend
      - name: Inspect or apply only D1 migration 0009
        working-directory: portal-v2-backend
        env:
          CI: 'true'
          CLOUDFLARE_ACCOUNT_ID: 47b9f8498a9865c0fbbaca8f0f5cf59d
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_D1_CONTRACT_TOKEN }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKUP_CONFIRMATION: ${{ inputs.backup_confirmation }}
        run: node scripts/upgrade-payment-locations-phone.mjs "$OPERATION" "$CONFIRMATION" "$BACKUP_CONFIRMATION"
