name: Cascade delete v2 backend test

on:
  push:
    branches: ["backend/cascade-delete-v2"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal-v2-backend/package-lock.json
      - working-directory: portal-v2-backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test current portal backend with cascade deletion
        working-directory: portal-v2-backend
        run: npm test
      - name: Compile Worker
        working-directory: portal-v2-backend
        run: npx wrangler deploy --dry-run
