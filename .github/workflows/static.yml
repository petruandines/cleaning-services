name: Redirect legacy GitHub Pages to petruandines.com

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare redirect-only Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf redirect-site
          mkdir -p redirect-site

          cat > /tmp/redirect.html <<'HTML'
          <!doctype html>
          <html lang="ro">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex, nofollow">
            <title>Petru & Inés — site mutat</title>
            <script>
              (function () {
                var legacyBase = '/cleaning-services';
                var path = window.location.pathname;
                if (path === legacyBase || path === legacyBase + '/') {
                  path = '/';
                } else if (path.indexOf(legacyBase + '/') === 0) {
                  path = path.slice(legacyBase.length);
                }
                var target = 'https://petruandines.com' + path + window.location.search + window.location.hash;
                window.location.replace(target);
              }());
            </script>
          </head>
          <body>
            <p>Site-ul Petru & Inés s-a mutat la <a href="https://petruandines.com/">petruandines.com</a>.</p>
          </body>
          </html>
          HTML

          cp /tmp/redirect.html redirect-site/index.html
          cp /tmp/redirect.html redirect-site/404.html

          while IFS= read -r file; do
            case "$file" in
              *.html)
                case "$file" in
                  .github/*|.deployment/*|docs/*|scripts/*|node_modules/*|portal-v2-backend/*) continue ;;
                esac
                mkdir -p "redirect-site/$(dirname "$file")"
                cp /tmp/redirect.html "redirect-site/$file"
                ;;
            esac
          done < <(git ls-files)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload redirect site
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect-site

      - name: Deploy redirect site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
