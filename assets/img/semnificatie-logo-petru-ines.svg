<svg xmlns="http://www.w3.org/2000/svg" width="720" height="541" viewBox="0 0 720 541" role="img" aria-labelledby="tit descr"><title id="tit">Semnificația logo-ului Petru &amp; Inés</title><desc id="descr">Schița vizuală explică inițiala P de la Petru, inițiala I de la Inés, conturul verde al unei case și steaua verde care simbolizează curățenia și prospețimea.</desc><image x="0" y="0" width="720" height="541" href="data:image/webp;base64,"/></svg>