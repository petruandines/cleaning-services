<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="color-scheme" content="light dark" />

  <title>Catalog Servicii | Petru & Inés</title>
  <meta name="description" content="Servicii profesionale de curățenie în București și Ilfov. Curățenie pentru locuințe și birouri, curățare tapițerii, vitrine, igienizare aer condiționat și ozonificare." />
  <meta name="author" content="Petru & Inés" />
  <meta name="robots" content="index, follow, max-image-preview:large" />

  <!-- Preview pentru Facebook, WhatsApp, LinkedIn, Messenger etc. -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ro_RO" />
  <meta property="og:site_name" content="Petru & Inés" />
  <meta property="og:title" content="Catalog Servicii | Petru & Inés" />
  <meta property="og:description" content="Servicii profesionale de curățenie în București și Ilfov. Descoperă catalogul complet de servicii Petru & Inés." />
  <!-- Dacă muți aplicația în altă locație, actualizează doar URL-ul absolut de mai jos. -->
  <meta property="og:image" content="https://petruandines.github.io/cleaning-services/catalog/social-preview.jpg" />
  <meta property="og:image:secure_url" content="https://petruandines.github.io/cleaning-services/catalog/social-preview.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Catalog Servicii Petru & Inés - curățenie profesională în București și Ilfov" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Catalog Servicii | Petru & Inés" />
  <meta name="twitter:description" content="Servicii profesionale de curățenie în București și Ilfov. Descoperă catalogul complet de servicii." />
  <meta name="twitter:image" content="https://petruandines.github.io/cleaning-services/catalog/social-preview.jpg" />

  <link rel="alternate" type="application/pdf" href="./catalog.pdf" title="Catalog Servicii Petru & Inés" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "Petru & Inés",
    "legalName": "Măcriș Petru Ionatan Persoană Fizică Autorizată",
    "description": "Servicii profesionale de curățenie în București și Ilfov: locuințe, birouri și spații comerciale, curățare tapițerii, vitrine, igienizare aer condiționat și ozonificare.",
    "areaServed": ["București", "Ilfov"],
    "telephone": "+40 772 053 562",
    "email": "petruandines@gmail.com",
    "url": "https://petruandines.github.io/cleaning-services/catalog/",
    "sameAs": ["https://www.facebook.com/petruandines"]
  }
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" class="app" aria-busy="true">
    <header id="topbar" class="topbar" aria-label="Comenzi catalog">
      <div class="toolbar-group toolbar-group--left">
        <button id="thumbToggle" class="icon-btn" type="button" aria-label="Arată sau ascunde paginile" aria-pressed="false" title="Pagini">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z"/></svg>
        </button>
        <button id="prevBtn" class="icon-btn" type="button" aria-label="Pagina precedentă" title="Pagina precedentă (←)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15.5 5-7 7 7 7 1.4-1.4-5.6-5.6 5.6-5.6L15.5 5Z"/></svg>
        </button>
        <div class="page-counter" title="Mergi la o pagină">
          <input id="pageInput" type="text" inputmode="numeric" autocomplete="off" aria-label="Numărul paginii" value="1" />
          <span aria-hidden="true">/</span>
          <span id="pageTotal">–</span>
        </div>
        <button id="nextBtn" class="icon-btn" type="button" aria-label="Pagina următoare" title="Pagina următoare (→)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8.5 19 7-7-7-7-1.4 1.4 5.6 5.6-5.6 5.6L8.5 19Z"/></svg>
        </button>
      </div>

      <div class="toolbar-group toolbar-group--center">
        <button id="zoomOutBtn" class="icon-btn" type="button" aria-label="Micșorează" title="Zoom out (−)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v2H5z"/></svg>
        </button>
        <button id="zoomResetBtn" class="zoom-value" type="button" aria-label="Potrivește pagina pe ecran" title="Potrivește pagina pe ecran">
          <span id="zoomValue">100%</span>
        </button>
        <button id="zoomInBtn" class="icon-btn" type="button" aria-label="Mărește" title="Zoom in (+)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>
        </button>
      </div>

      <div class="toolbar-group toolbar-group--right">
        <button id="searchToggle" class="icon-btn" type="button" aria-label="Caută în document" aria-pressed="false" title="Caută (Ctrl/Cmd + F)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20.7 19.3-4.2-4.2a7 7 0 1 0-1.4 1.4l4.2 4.2 1.4-1.4ZM5 10.5a5.5 5.5 0 1 1 11 0 5.5 5.5 0 0 1-11 0Z"/></svg>
        </button>
        <button id="shareBtn" class="icon-btn optional-mobile" type="button" aria-label="Distribuie pagina curentă" title="Distribuie pagina curentă">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16a3 3 0 0 0-2.4 1.2l-7-4.1a3.5 3.5 0 0 0 0-2.2l7-4.1A3 3 0 1 0 15 5c0 .1 0 .3.1.4l-7 4.1a3 3 0 1 0 0 5l7 4.1A3 3 0 1 0 18 16Z"/></svg>
        </button>
        <a id="downloadBtn" class="icon-btn" href="./catalog.pdf" download aria-label="Descarcă PDF-ul" title="Descarcă PDF-ul">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3h2v10.2l3.6-3.6L18 11l-6 6-6-6 1.4-1.4 3.6 3.6V3ZM5 19h14v2H5v-2Z"/></svg>
        </a>
      </div>
    </header>

    <section id="stage" class="stage" aria-label="Document PDF">
      <button id="edgePrev" class="edge-nav edge-nav--prev" type="button" aria-label="Pagina precedentă">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15.5 5-7 7 7 7 1.4-1.4-5.6-5.6 5.6-5.6L15.5 5Z"/></svg>
      </button>

      <div id="pageFrame" class="page-frame">
        <div id="pageVisual" class="page-visual">
          <canvas id="pdfCanvas" class="pdf-canvas" aria-label="Pagina PDF"></canvas>
          <div id="highlightLayer" class="highlight-layer" aria-hidden="true"></div>
          <div id="textLayer" class="textLayer" aria-label="Text selectabil din pagina PDF"></div>
          <div id="annotationLayer" class="annotation-layer" aria-label="Linkuri din PDF"></div>
        </div>
      </div>

      <button id="edgeNext" class="edge-nav edge-nav--next" type="button" aria-label="Pagina următoare">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8.5 19 7-7-7-7-1.4 1.4 5.6 5.6-5.6 5.6L8.5 19Z"/></svg>
      </button>

      <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite">
        <div class="loader-card">
          <span class="spinner" aria-hidden="true"></span>
          <div>
            <strong id="loadingTitle">Se încarcă documentul…</strong>
            <div id="loadingDetail" class="loading-detail">Pregătim catalogul.</div>
          </div>
        </div>
      </div>

      <div id="errorPanel" class="error-panel" hidden>
        <h1>PDF-ul nu a putut fi deschis</h1>
        <p id="errorMessage">Verifică dacă fișierul <code>catalog.pdf</code> este lângă <code>index.html</code>.</p>
        <button id="retryBtn" type="button" class="text-btn">Reîncearcă</button>
      </div>
    </section>

    <aside id="searchPanel" class="search-panel" aria-label="Căutare în document" hidden>
      <div class="search-head">
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20.7 19.3-4.2-4.2a7 7 0 1 0-1.4 1.4l4.2 4.2 1.4-1.4ZM5 10.5a5.5 5.5 0 1 1 11 0 5.5 5.5 0 0 1-11 0Z"/></svg>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Caută în document…" aria-label="Cuvânt sau expresie" />
          <button id="clearSearch" class="mini-btn" type="button" aria-label="Șterge căutarea" title="Șterge">×</button>
        </div>
        <button id="searchClose" class="icon-btn icon-btn--panel" type="button" aria-label="Închide căutarea" title="Închide">×</button>
      </div>
      <div id="searchStatus" class="search-status">Scrie un cuvânt sau o expresie.</div>
      <div id="searchResults" class="search-results" role="list"></div>
    </aside>

    <aside id="thumbDrawer" class="thumb-drawer" aria-label="Pagini document">
      <button id="thumbClose" class="drawer-handle" type="button" aria-label="Ascunde paginile">
        <span></span>
      </button>
      <div id="thumbStrip" class="thumb-strip"></div>
    </aside>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
